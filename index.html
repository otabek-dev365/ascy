<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ascy</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <canvas id="matrix"></canvas>
    <div id="shade"></div>
    <div id="tabbar">
      <div id="tabs"></div>
      <button id="newtab" title="New tab (Ctrl+Shift+T)">+</button>
      <button id="menubtn" title="Menu">☰</button>
    </div>
    <div id="menu" hidden>
      <div class="menu-group">
        <div class="menu-label"><span>Theme</span></div>
        <!-- buttons are filled in from the theme list (built-in + settings.json) -->
        <div id="m-theme" class="chips" role="radiogroup" aria-label="Theme"></div>
      </div>
      <div class="menu-row">
        <label for="m-matrix">Matrix rain</label>
        <input id="m-matrix" class="switch" type="checkbox" role="switch" />
      </div>
      <div class="menu-group">
        <div class="menu-label">
          <span>Shade (dims the rain)</span>
          <span id="m-shade-val"></span>
        </div>
        <input id="m-shade" type="range" min="0" max="90" step="5" />
      </div>
      <div class="menu-group">
        <div class="menu-label">
          <span>Font size</span>
          <span id="m-font-val"></span>
        </div>
        <input id="m-font" type="range" min="8" max="28" step="1" />
      </div>
      <div class="menu-actions">
        <button id="m-settings" title="Open settings.json">Settings file</button>
        <button id="m-reload" title="Reload from file (Ctrl+Shift+R)">↻</button>
      </div>
    </div>
    <div id="searchbar" hidden>
      <input id="searchinput" type="text" placeholder="Search…" spellcheck="false" />
      <span id="searchcount"></span>
      <button id="searchprev" title="Previous (Shift+Enter)">▲</button>
      <button id="searchnext" title="Next (Enter)">▼</button>
      <button id="searchclose" title="Close (Esc)">×</button>
    </div>
    <div id="toast" hidden></div>
    <div id="ctxmenu" role="menu" hidden></div>
    <div id="dialog" hidden>
      <div class="dialog-box" role="alertdialog" aria-modal="true" aria-labelledby="dialog-title">
        <div id="dialog-title"></div>
        <div id="dialog-text"></div>
        <div class="dialog-actions">
          <button id="dialog-cancel" type="button">Cancel</button>
          <button id="dialog-ok" type="button">Close</button>
        </div>
      </div>
    </div>
    <div id="terms"></div>
  </body>
</html>
