[package]
name = "ascy"
version = "0.1.0"
description = "A hacker-style terminal emulator built with Tauri and xterm.js"
authors = ["Otabek"]
license = "MIT"
repository = "https://github.com/otabek-dev365/ascy"
edition = "2021"

[lib]
name = "ascy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
