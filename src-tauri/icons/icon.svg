<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c2410"/>
      <stop offset="0.55" stop-color="#041007"/>
      <stop offset="1" stop-color="#010402"/>
    </linearGradient>
    <linearGradient id="rain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ff41" stop-opacity="0.08"/>
      <stop offset="0.45" stop-color="#00ff41" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00ff41" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="clip">
      <rect x="16" y="16" width="480" height="480" rx="110"/>
    </clipPath>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bg)"/>

  <g clip-path="url(#clip)" font-family="'Noto Sans CJK JP','Noto Serif CJK JP',monospace" font-size="44" fill="url(#rain)">
    <text x="48" y="70">ネ</text><text x="48" y="122">3</text><text x="48" y="174">カ</text><text x="48" y="226">0</text>
    <text x="128" y="100">7</text><text x="128" y="152">サ</text><text x="128" y="204">$</text>
    <text x="208" y="62">ツ</text><text x="208" y="114">9</text>
    <text x="288" y="92">Z</text><text x="288" y="144">ホ</text><text x="288" y="196">1</text>
    <text x="368" y="72">ク</text><text x="368" y="124">#</text><text x="368" y="176">メ</text><text x="368" y="228">5</text>
    <text x="444" y="102">8</text><text x="444" y="154">ラ</text>
  </g>

  <rect x="16" y="16" width="480" height="480" rx="110" fill="none" stroke="#00ff41" stroke-opacity="0.35" stroke-width="5"/>

  <g filter="url(#glow)">
    <path d="M116 250 L212 330 L116 410" fill="none" stroke="#00ff41" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="250" y="390" width="146" height="42" rx="12" fill="#00ff41"/>
  </g>
</svg>
